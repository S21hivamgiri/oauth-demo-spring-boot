<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Auth0 + OAuth2 + OIDC + PKCE + RBAC — Local Demo">
    <meta name="keywords" content="HTML, CSS, JavaScript, Auth0, OIDC, Outh2, RBAC">
    <meta name="author" content="Shivam Kumar Giri">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 + OIDC + PKCE Demo</title>
    <style>
        body {
            max-width: 100%;
            padding: 0;
            margin: 0;
        }

        button {
            font-size: 20px;
            height: stretch;
            display: flex;
            align-items: center;
            border-left: 4px solid rgb(0, 0, 0);
            border-right: 4px solid rgb(0, 0, 0);
            flex-direction: row;
            padding: 20px;
        }

        .row {
            justify-content: space-evenly;
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 10px;
            border-bottom: 2px solid rgb(170, 170, 0);
        }

        .logo {
            font-size: 32px;
            text-transform: uppercase;
        }

        .login {
            background-color: rgba(216, 134, 0, 0.1);
            color: rgb(255, 157, 0);

        }

        .health {
            background-color: rgba(0, 255, 0, 0.1);
            color: green;
        }

        .logout {
            background-color: rgba(255, 0, 0, 0.1);
            color: red;
        }

        .call-api {
            background-color: rgba(0, 0, 255, 0.1);
            color: blue;
        }

        .call-admin-api {
            color: black;
        }

        #log {
            justify-content: center;
            font-size: 30px;
            border-radius: 20px;
            min-height: 300px;
            border: 4px solid black;
            display: flex;
            align-items: center;
            margin: 64px 20px 0 20px;
            background-color: aliceblue;
        }

        h1 {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<navbar class="row">
    <div class="logo"><img src="./auth.png" height="52px" width="52px" />Auth</div>
    <button id="loginBtn" class="login"><img src="./login.png" height="30px" width="30px" /> Login (starts PKCE
        flow)</button>
    <button id="serverHealth" class="health"><img src="./health.png" height="52px" width="52px" />Check Server
        Health</button>
    <button id="callMeBtn" class="call-api"><img src="./server.png" height="52px" width="52px" />Call Server API
        /api/me</button>
    <button id="callAdminBtn" class="call-admin-api"><img src="./admin.png" height="52px" width="52px" />Call Admin only
        API /api/admin/dashboard</button>
    <button id="logoutBtn" class="logout"><img src="./logout.png" height="30px" width="30px" />Log Out</button>
</navbar>
<h1>OAuth2 / OIDC / PKCE Demo with Auth0</h1>
